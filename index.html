<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenOrSkip — Newsletter Subject Line Decision Engine</title>
    <meta name="description" content="Test 2-3 newsletter subject lines against 40 niche founder personas in 15 seconds before you send. Fast structured open and skip counts." />
    <meta property="og:title" content="OpenOrSkip — Newsletter Subject Line Decision Engine" />
    <meta property="og:description" content="Test 2-3 newsletter subject lines against 40 niche founder personas in 15 seconds before you send. Fast structured open and skip counts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      // Ignore harmless Vite HMR WebSocket connection errors in sandbox iframe
      window.addEventListener('error', function(e) {
        var msg = e && e.message ? String(e.message) : '';
        var file = e && e.filename ? String(e.filename) : '';
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || file.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        if (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport') || reason.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>
  </head>
  <body class="bg-[#fcf8fb] text-[#1b1b1d] antialiased selection:bg-[#0066cc]/15 selection:text-[#004e9f]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
